<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lady Knowledge Labs</title>
<style>
  :root { color-scheme: light dark; --bg: #fafaf7; --fg: #1d1d1b; --link: #0b5cad; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --fg: #e8e8e4; --link: #7db4f0; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 1rem;
         padding: 1rem; background: var(--bg); color: var(--fg);
         font: 1.125rem/1.6 system-ui, sans-serif; text-align: center; }
  h1 { margin: 0; font-size: 2rem; font-weight: 600; }
  a { color: var(--link); }
</style>
</head>
<body>
<h1>Lady Knowledge Labs</h1>
<a href="/homelab/">The home lab</a>
</body>
</html>
